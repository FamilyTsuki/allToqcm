<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>allToAsk - Nouveau Questionnaire</title>
    <script src="theme.js?v=2.0.1"></script>
    <link rel="stylesheet" href="style.css?v=2.0.1" />
  </head>
  <body>
    <div class="app-container">
      <header class="main-header">
        <div class="logo-area">
          <h1>allToAsk</h1>
        </div>
        <div class="header-right">
          <button
            id="theme-toggle"
            class="btn btn-ghost btn-icon"
            type="button"
            aria-label="Changer de thème"
            title="Basculer le thème"
          >
            <svg
              class="theme-icon-light"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="12" r="5" />
              <line x1="12" y1="1" x2="12" y2="3" />
              <line x1="12" y1="21" x2="12" y2="23" />
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
              <line x1="1" y1="12" x2="3" y2="12" />
              <line x1="21" y1="12" x2="23" y2="12" />
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
            </svg>
            <svg
              class="theme-icon-dark"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
            </svg>
          </button>
          <nav class="nav-tabs">
            <a href="/" class="nav-tab-link">Questionnaires</a>
            <a href="/create.html" class="nav-tab-link active">+ Nouveau</a>
          </nav>
        </div>
      </header>

      <main class="content-area">
        <section class="creator-section">
          <div class="section-title-bar">
            <h2>Nouveau Questionnaire</h2>
            <a href="/" class="btn btn-ghost btn-sm">&larr; Retour</a>
          </div>

          <form id="creator-form" class="creator-form">
            <div class="form-group">
              <input
                type="text"
                id="survey-title-input"
                class="input-title-large"
                required
                placeholder="Titre du questionnaire..."
                autofocus
              />
            </div>
            <div class="form-group">
              <input
                type="text"
                id="survey-desc-input"
                class="input-desc-subtle"
                placeholder="Description ou contexte (optionnel)"
              />
            </div>

            <div class="questions-section">
              <div class="questions-header">
                <h3>Questions</h3>
              </div>
              <div id="creator-questions-list" class="creator-questions-list"></div>
              <div>
                <button id="btn-add-question" class="btn btn-ghost btn-sm" type="button">
                  + Ajouter une question
                </button>
              </div>
            </div>

            <div class="form-actions">
              <button type="submit" class="btn btn-primary btn-large">
                Publier le questionnaire
              </button>
            </div>
          </form>

          <div id="share-modal" class="modal hidden">
            <div class="modal-content modal-content-sm">
              <div class="modal-header">
                <h3>Questionnaire publié !</h3>
                <button id="btn-close-share-modal" class="btn btn-text" type="button">
                  &times;
                </button>
              </div>
              <div class="share-modal-body">
                <div class="qr-code-frame">
                  <img id="share-qr-image" alt="QR Code" />
                </div>
                <div class="qr-color-picker-row">
                  <span class="qr-color-label">Couleur :</span>
                  <div class="qr-color-chips" id="qr-color-chips">
                    <button
                      type="button"
                      class="qr-color-chip active"
                      data-color="#0c0c0e"
                      style="background-color: #0c0c0e"
                      title="Noir"
                    ></button>
                    <button
                      type="button"
                      class="qr-color-chip"
                      data-color="#2563eb"
                      style="background-color: #2563eb"
                      title="Bleu ardoise"
                    ></button>
                    <button
                      type="button"
                      class="qr-color-chip"
                      data-color="#475569"
                      style="background-color: #475569"
                      title="Ardoise"
                    ></button>
                    <button
                      type="button"
                      class="qr-color-chip"
                      data-color="#4f46e5"
                      style="background-color: #4f46e5"
                      title="Indigo"
                    ></button>
                    <button
                      type="button"
                      class="qr-color-chip"
                      data-color="#9f1239"
                      style="background-color: #9f1239"
                      title="Bordeaux"
                    ></button>
                  </div>
                </div>
                <div class="share-input-group">
                  <input type="text" id="share-url-input" spellcheck="false" autocomplete="off" />
                  <button type="button" id="btn-copy-url" class="btn btn-secondary btn-sm">
                    Copier
                  </button>
                </div>
                <div class="share-modal-actions">
                  <a
                    id="share-download-qr"
                    download="qrcode.png"
                    href="#"
                    class="btn btn-secondary btn-sm"
                    >Télécharger QR (.png)</a
                  >
                  <a id="share-open-link" href="#" target="_blank" class="btn btn-primary btn-sm"
                    >Ouvrir &rarr;</a
                  >
                  <a href="/" class="btn btn-secondary btn-sm">Tous les questionnaires</a>
                </div>
              </div>
            </div>
          </div>
        </section>
      </main>

      <div id="notification-toast" class="toast hidden"></div>
    </div>

    <script type="module" src="create.js?v=2.0.1"></script>
  </body>
</html>
