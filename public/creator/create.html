<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>allToAsk - Nouveau Questionnaire</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-container">
      <header class="main-header">
        <div class="logo-area">
          <h1>allToAsk</h1>
        </div>
        <nav class="nav-tabs">
          <a href="/" class="nav-tab-link">Questionnaires</a>
          <a href="/create.html" class="nav-tab-link active">+ Nouveau</a>
        </nav>
      </header>

      <main class="content-area">
        <section class="creator-section">
          <div class="section-title-bar">
            <h2>Nouveau Questionnaire</h2>
            <a href="/" class="btn btn-ghost btn-sm">&larr; Retour</a>
          </div>

          <form id="creator-form" class="creator-form">
            <div class="form-group">
              <input
                type="text"
                id="survey-title-input"
                class="input-title-large"
                required
                placeholder="Titre du questionnaire..."
                autofocus
              />
            </div>
            <div class="form-group">
              <input
                type="text"
                id="survey-desc-input"
                class="input-desc-subtle"
                placeholder="Description ou contexte (optionnel)"
              />
            </div>

            <div class="questions-section">
              <div class="questions-header">
                <h3>Questions</h3>
              </div>
              <div id="creator-questions-list" class="creator-questions-list"></div>
              <div>
                <button id="btn-add-question" class="btn btn-ghost btn-sm" type="button">
                  + Ajouter une question
                </button>
              </div>
            </div>

            <div class="form-actions">
              <button type="submit" class="btn btn-primary btn-large">
                Publier le questionnaire
              </button>
            </div>
          </form>

          <div id="share-modal" class="modal hidden">
            <div class="modal-content modal-content-sm">
              <div class="modal-header">
                <h3>Questionnaire publié !</h3>
                <button id="btn-close-share-modal" class="btn btn-text" type="button">
                  &times;
                </button>
              </div>
              <div class="share-modal-body">
                <div class="qr-code-frame">
                  <img id="share-qr-image" alt="QR Code" />
                </div>
                <div class="qr-color-picker-row">
                  <span class="qr-color-label">Couleur :</span>
                  <div class="qr-color-chips" id="qr-color-chips">
                    <button
                      type="button"
                      class="qr-color-chip active"
                      data-color="#0c0c0e"
                      style="background-color: #0c0c0e"
                      title="Noir"
                    ></button>
                    <button
                      type="button"
                      class="qr-color-chip"
                      data-color="#3b82f6"
                      style="background-color: #3b82f6"
                      title="Bleu"
                    ></button>
                    <button
                      type="button"
                      class="qr-color-chip"
                      data-color="#10b981"
                      style="background-color: #10b981"
                      title="Vert"
                    ></button>
                    <button
                      type="button"
                      class="qr-color-chip"
                      data-color="#8b5cf6"
                      style="background-color: #8b5cf6"
                      title="Violet"
                    ></button>
                    <button
                      type="button"
                      class="qr-color-chip"
                      data-color="#ef4444"
                      style="background-color: #ef4444"
                      title="Rouge"
                    ></button>
                  </div>
                </div>
                <div class="share-input-group">
                  <input type="text" id="share-url-input" spellcheck="false" autocomplete="off" />
                  <button type="button" id="btn-copy-url" class="btn btn-secondary btn-sm">
                    Copier
                  </button>
                </div>
                <div class="share-modal-actions">
                  <a
                    id="share-download-qr"
                    download="qrcode.png"
                    href="#"
                    class="btn btn-secondary btn-sm"
                    >Télécharger QR (.png)</a
                  >
                  <a id="share-open-link" href="#" target="_blank" class="btn btn-primary btn-sm"
                    >Ouvrir &rarr;</a
                  >
                  <a href="/" class="btn btn-secondary btn-sm">Tous les questionnaires</a>
                </div>
              </div>
            </div>
          </div>
        </section>
      </main>

      <div id="notification-toast" class="toast hidden"></div>
    </div>

    <script type="module" src="create.js"></script>
  </body>
</html>
